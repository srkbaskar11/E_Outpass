<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate Verification | Outpass Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="#" class="navbar-brand">
      <span class="logo">🏫</span> Outpass Portal
    </a>
    <div class="navbar-menu">
      <div class="user-info">
        <span id="user-name">Gate Staff</span>
      </div>
      <button class="btn btn-outline btn-sm" id="btn-logout">Logout</button>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px;">
    
    <div class="row">
      <div class="col-md-8" style="margin: 0 auto;">
        
        <div class="glass-card text-center" style="padding: 40px 20px;">
          <h2 style="margin-bottom: 20px;">QR Code Verification</h2>
          <p class="text-muted" style="margin-bottom: 30px;">Scan student's QR code or enter token manually</p>
          
          <div style="max-width: 400px; margin: 0 auto;">
            <div class="form-group">
              <input type="text" id="qr-token-input" class="form-control" style="font-size: 1.2rem; text-align: center; letter-spacing: 2px;" placeholder="Enter Token / Scan Code" autocomplete="off">
            </div>
            
            <button id="btn-verify" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 12px;" onclick="verifyQR()">
              VERIFY TOKEN
            </button>
          </div>
          
          <!-- Verification Result Area -->
          <div id="result-area"></div>
          
        </div>

        <!-- Recent Verifications -->
        <h4 style="margin-top: 40px; margin-bottom: 15px;">Recent Scans</h4>
        <div class="table-container" id="recent-scans-container">
          <div class="empty-state" style="padding: 30px;">
            <p>No recent scans in this session.</p>
          </div>
        </div>

      </div>
    </div>
    
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/gate.js"></script>
</body>
</html>
